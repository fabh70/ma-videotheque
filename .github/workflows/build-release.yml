name: Construire et publier

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Construire Videotheque.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name Videotheque --icon logo.ico
          --add-data "index.html;." videotheque_app.py

      - name: Telecharger et extraire VLC portable
        shell: python
        run: |
          import os
          import shutil
          import urllib.request
          import zipfile

          url = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          urllib.request.urlretrieve(url, "vlc.zip")

          with zipfile.ZipFile("vlc.zip") as archive:
              archive.extractall("vlc-temp")

          source = os.path.join("vlc-temp", "vlc-3.0.21")
          os.makedirs("VLC", exist_ok=True)
          for name in os.listdir(source):
              shutil.move(os.path.join(source, name), os.path.join("VLC", name))

          os.remove("vlc.zip")
          shutil.rmtree("vlc-temp")
          print("VLC pret :", os.path.isfile(os.path.join("VLC", "vlc.exe")))

      - name: Creer la version portable
        shell: python
        run: |
          import os
          import shutil
          import zipfile

          dest = "MaVideotheque_Portable"
          os.makedirs(os.path.join(dest, "donnees"), exist_ok=True)
          shutil.copy2(os.path.join("dist", "Videotheque.exe"), dest)
          shutil.copy2("LISEZMOI.txt", dest)
          shutil.copy2("logo.ico", dest)
          with open(os.path.join(dest, "portable.flag"), "w", encoding="utf-8") as handle:
              handle.write("portable")
          shutil.copytree("VLC", os.path.join(dest, "VLC"))

          with zipfile.ZipFile("MaVideotheque_Portable.zip", "w",
                               zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for root, _dirs, files in os.walk(dest):
                  for name in files:
                      full = os.path.join(root, name)
                      archive.write(full, os.path.relpath(full, "."))
          print("Archive portable prete")

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: MaVideotheque-windows
          path: |
            dist/Videotheque.exe
            MaVideotheque_Portable.zip

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Videotheque.exe
            MaVideotheque_Portable.zip
          generate_release_notes: true
