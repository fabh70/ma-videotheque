name: Construire et publier

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Construire Videotheque.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name Videotheque --icon logo.ico
          --add-data "index.html;." videotheque_app.py

      - name: Telecharger VLC portable
        shell: pwsh
        run: |
          $url = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile vlc.zip
          Expand-Archive -Path vlc.zip -DestinationPath vlc-temp -Force
          New-Item -ItemType Directory -Path VLC -Force | Out-Null
          Copy-Item -Path "vlc-temp\vlc-3.0.21\*" -Destination VLC -Recurse -Force
          Remove-Item vlc.zip, vlc-temp -Recurse -Force

      - name: Creer la version portable
        shell: pwsh
        run: |
          $dest = "MaVideotheque_Portable"
          New-Item -ItemType Directory -Path "$dest\donnees" -Force | Out-Null
          Copy-Item "dist\Videotheque.exe" $dest
          Copy-Item "LISEZMOI.txt" $dest
          Copy-Item "logo.ico" $dest
          Set-Content -Path "$dest\portable.flag" -Value "portable" -NoNewline
          Copy-Item "VLC" "$dest\VLC" -Recurse
          Compress-Archive -Path $dest -DestinationPath "MaVideotheque_Portable.zip" -Force

      - name: Publier les artefacts de compilation
        uses: actions/upload-artifact@v4
        with:
          name: MaVideotheque-windows
          path: |
            dist/Videotheque.exe
            MaVideotheque_Portable.zip

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Videotheque.exe
            MaVideotheque_Portable.zip
          generate_release_notes: true
